name: DevSecOps Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Semgrep
        run: pipx install semgrep==1.181.1

      - name: Semgrep source scan
        id: semgrep
        continue-on-error: true
        run: semgrep scan --config p/ci --metrics off --error app.py

      - name: Semgrep SQL injection scan
        id: semgrep_sql
        continue-on-error: true
        run: semgrep scan --config sql-injection.yml --metrics off --error app.py

      - name: Trivy dependency scan
        id: dependency
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: requirements.txt
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Hadolint Dockerfile scan
        id: dockerfile
        continue-on-error: true
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Build application image
        id: build
        continue-on-error: true
        run: docker build -t demo-app:${{ github.sha }} .

      - name: Trivy image scan
        id: image
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: demo-app:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Enforce security gate
        if: always()
        env:
          GITLEAKS: ${{ steps.gitleaks.outcome }}
          SEMGREP: ${{ steps.semgrep.outcome }}
          SEMGREP_SQL: ${{ steps.semgrep_sql.outcome }}
          DEPENDENCY: ${{ steps.dependency.outcome }}
          DOCKERFILE: ${{ steps.dockerfile.outcome }}
          BUILD: ${{ steps.build.outcome }}
          IMAGE: ${{ steps.image.outcome }}
        run: |
          printf 'gitleaks=%s semgrep=%s semgrep_sql=%s dependency=%s dockerfile=%s build=%s image=%s\n' "$GITLEAKS" "$SEMGREP" "$SEMGREP_SQL" "$DEPENDENCY" "$DOCKERFILE" "$BUILD" "$IMAGE"
          test "$GITLEAKS" = success && test "$SEMGREP" = success && test "$SEMGREP_SQL" = success && test "$DEPENDENCY" = success && test "$DOCKERFILE" = success && test "$BUILD" = success && test "$IMAGE" = success
